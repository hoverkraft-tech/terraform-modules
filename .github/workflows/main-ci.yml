name: Main - Continuous Integration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: $/.github/workflows/__shared-ci.yml
    permissions:
      contents: read

  docs:
    needs: ci
    # TODO: Use a release containing https://github.com/hoverkraft-tech/ci-github-iac/pull/46.
    uses: hoverkraft-tech/ci-github-iac/.github/workflows/terraform-docs.yml@082a2112ab700b7d0a483f700c31a4cefb550596 # PR #46 (unreleased)
    permissions:
      contents: read
    with:
      github-app-client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
    secrets:
      github-app-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
