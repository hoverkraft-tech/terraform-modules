name: Generate Terraform Docs

on:
  push:
    branches:
      - main
    paths:
      - "**/*.tf"
  pull_request:
    paths:
      - "**/*.tf"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Render terraform docs
        uses: terraform-docs/gh-actions@6de6da0cefcc6b4b7a5cbea4d79d97060733093c # v1.4.1
        with:
          find-dir: .
          output-file: README.md
          output-method: inject
          args: --lockfile=false
          git-push: "false"

      - name: Check generated documentation
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- '**/README.md'

      - id: generate-token
        if: github.event_name == 'push'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.CI_BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.CI_BOT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Update generated documentation
        if: github.event_name == 'push'
        uses: hoverkraft-tech/ci-github-common/actions/create-and-merge-pull-request@d606f77fad305ef07dfde3db5270f5e324019c97 # 4.2.4
        with:
          github-token: ${{ steps.generate-token.outputs.token }}
          branch: docs/terraform-modules
          title: "docs: update Terraform module documentation"
          body: Update generated Terraform module documentation.
          commit-message: "docs: update Terraform module documentation"
