version: 2

updates:
  - package-ecosystem: "github-actions"
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      include: scope
    open-pull-requests-limit: 20
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "devcontainers"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    directory: "/"
    schedule:
      interval: weekly

  - package-ecosystem: "docker"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      docker-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 20
    directories:
      - /ovh/**/*
    schedule:
      interval: "weekly"
    groups:
      terraform-dependencies:
        patterns:
          - "*"
